# NFC Terminal Image Generation Configuration
# For Raspberry Pi CM4 with 8GB eMMC
# A/B partition layout for RAUC OTA updates

image boot.vfat {
	vfat {
		# Note: Files must be at root level for Pi bootloader
		# Our post-image.sh prepares the flat structure
		files = {
			"bcm2711-rpi-cm4.dtb",
			"Image",
			"cmdline.txt",
			"config.txt",
			"fixup4.dat",
			"start4.elf",
			"overlays",
			"boot.ini",
		}
	}
	size = 32M
}

image nfc-terminal.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs_b.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
